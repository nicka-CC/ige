<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Тест по программированию 5</title>
    <style>
        :root {
            --system-background: #f2f2f7;
            --system-blue: #007aff;
            --system-gray: #8e8e93;
            --separator-color: #c6c6c8;
            --label-primary: #000000;
            --label-secondary: #8e8e93;
            --grouped-background: #ffffff;
            --grouped-background-ios: #f0f0f0;
            --system-green: #34c759;
            --system-red: #ff3b30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Arial", sans-serif;
            margin: 0;
            background-color: var(--grouped-background-ios);
            color: var(--label-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        .header { background-color: var(--grouped-background); padding: 12px 10px; text-align: center; font-size: 17px; font-weight: 600; border-bottom: 0.5px solid var(--separator-color); position: relative; display: flex; align-items: center; justify-content: center; }
        .back-button { position: absolute; left: 16px; font-size: 17px; color: var(--system-blue); text-decoration: none; cursor: pointer; }
        .footer { background-color: var(--grouped-background); padding: 12px 20px; text-align: center; font-size: 12px; color: var(--label-secondary); border-top: 0.5px solid var(--separator-color); margin-top: auto; }
        main { flex-grow: 1; padding: 22px 0; }
        .content-container { background-color: var(--grouped-background); margin: 0 16px; border-radius: 10px; overflow: hidden; border: 0.5px solid var(--separator-color); padding: 16px; }
        #question-text { font-size: 18px; font-weight: 500; margin-bottom: 20px; min-height: 60px; }
        #answers-container { display: flex; flex-direction: column; gap: 12px; }
        .answer-btn { width: 100%; padding: 14px 16px; font-size: 17px; cursor: pointer; border: 1px solid var(--separator-color); background: var(--grouped-background); border-radius: 8px; text-align: left; transition: background-color 0.2s; }
        .answer-btn:hover:not(:disabled) { background: #e5e5ea; }
        .answer-btn.correct { background-color: var(--system-green); border-color: var(--system-green); color: white; font-weight: 600; }
        .answer-btn.wrong { background-color: var(--system-red); border-color: var(--system-red); color: white; font-weight: 600; }
        .answer-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        #next-button { width: 100%; padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; display: block; margin: 30px auto 0; background-color: var(--system-blue); color: white; border: none; border-radius: 8px; }
        #next-button:disabled { background-color: var(--system-gray); }
        #feedback { text-align: center; font-size: 18px; font-weight: bold; margin-top: 20px; min-height: 25px; }
        .correct-text { color: var(--system-green); }
        .wrong-text { color: var(--system-red); }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        @media (min-width: 768px) { main { display: flex; justify-content: center; } .content-container { max-width: 600px; width: 100%; } }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-button">&lsaquo; Назад</a>
        <span>Тест по программированию 5</span>
    </header>
    <main>
        <div class="content-container">
            <h1>Тест по программированию 5</h1>
            <div id="quiz-area">
                <div id="question-text"></div>
                <div id="answers-container"></div>
                <div id="feedback"></div>
            </div>
            <button id="next-button">Следующий вопрос</button>
        </div>
    </main>
    <footer class="footer">
        Решу игэ - сдам гиа
    </footer>
<script>

    ["Что такое 'утечка памяти' (memory leak)?", ["Происходит, когда программа выделяет память динамически, но не освобождает ее после использования. Эта память остается занятой до завершения программы, что может привести к исчерпанию доступной памяти.", "Представляет исключительное владение ресурсом. Он не может быть скопирован, но может быть перемещен. Ресурс автоматически освобождается, когда unique_ptr выходит из области видимости.", "Это специальный метод класса, который автоматически вызывается при создании объекта. Его основная задача — инициализировать состояние объекта (например, выделить память).", "Это способность объектов разных классов реагировать на один и тот же вызов метода по-разному. В C++ реализуется через виртуальные функции."], 0],
    ["Что такое конструктор в C++?", ["Это специальный метод класса, который автоматически вызывается при создании объекта. Его основная задача — инициализировать состояние объекта (например, выделить память).", "Это процесс, при котором функция вызывает сама себя, либо напрямую, либо косвенно. Каждая рекурсивная функция должна иметь базовый случай, который останавливает рекурсию.", "Это переменная, которая хранит адрес другой переменной. Может быть nullptr и изменять свой адрес.", "Происходит, когда программа выделяет память динамически, но не освобождает ее после использования. Эта память остается занятой до завершения программы, что может привести к исчерпанию доступной памяти."], 0],
    ["В чем разница между `struct` и `class` в C++?", ["В `struct` члены по умолчанию `public`, а в `class` — `private`. Оба могут иметь методы, конструкторы и наследоваться. Struct чаще используют для простых данных.", "В `struct` нельзя объявлять методы, а в `class` можно. Struct предназначен только для хранения данных.", "`class` поддерживает наследование, а `struct` - нет. `class` является основой ООП в С++.", "Различий нет, это синонимы, оставленные для обратной совместимости с языком C."], 0],
    ["Что такое полиморфизм в ООП?", ["Это способность объектов разных классов реагировать на один и тот же вызов метода по-разному. В C++ реализуется через виртуальные функции.", "Это объединение данных и методов, работающих с ними, в единое целое (класс) со скрытием реализации.", "Это механизм, позволяющий одному классу наследовать свойства и поведение другого класса.", "Это выделение наиболее существенных характеристик объекта, игнорируя менее важные детали."], 0],
    ["Что такое `std::unique_ptr`?", ["Представляет исключительное владение ресурсом. Он не может быть скопирован, но может быть перемещен. Ресурс автоматически освобождается, когда unique_ptr выходит из области видимости.", "Реализует совместное владение ресурсом с подсчетом ссылок. Может быть скопирован. Ресурс освобождается, когда счетчик ссылок становится равным нулю.", "Слабый указатель, который не участвует в подсчете ссылок и используется для разрыва циклических зависимостей.", "Это базовый класс для всех умных указателей, определяющий их общий интерфейс."], 0],
    ["Опишите V-образную модель ЖЦПО.", ["Это расширение водопадной модели, которое явно связывает каждую фазу разработки (левая сторона 'V') с соответствующей фазой тестирования (правая сторона 'V').", "Это линейная, последовательная модель, где каждая фаза должна быть завершена до начала следующей. Переходы идут только в одном направлении.", "Разработка разбивается на небольшие, повторяющиеся циклы (итерации). Каждая итерация создает полностью функциональную часть системы.", "Это гибридная модель, сочетающая элементы водопадной и итерационной моделей, с явным акцентом на управление рисками."], 0],
    ["Что такое инкапсуляция?", ["Объединение данных и методов, работающих с ними, в единое целое (класс) и скрытие внутренней реализации от внешнего мира. Доступ к данным осуществляется через публичные методы.", "Способность объектов разных классов реагировать на один и тот же вызов метода по-разному.", "Механизм, позволяющий одному классу наследовать свойства и поведение другого класса.", "Выделение наиболее существенных характеристик объекта, игнорируя менее важные детали."], 0],
    ["Для чего нужен оператор `delete[]`?", ["Используется для освобождения памяти, выделенной для массива объектов с помощью `new[]`. Он вызывает деструктор для каждого элемента массива.", "Используется для освобождения памяти, выделенной для одиночного объекта с помощью `new`.", "Используется для освобождения памяти, выделенной с помощью `malloc` или `calloc`.", "Это устаревший оператор, который был заменен на `delete` в современных стандартах C++."], 0],
    ["В чем разница между передачей по значению и по ссылке?", ["При передаче по значению создается копия объекта, и изменения внутри функции не влияют на оригинал. При передаче по ссылке передается псевдоним объекта, и изменения затрагивают оригинал.", "При передаче по значению передается указатель на объект. При передаче по ссылке создается копия.", "Передача по ссылке всегда безопаснее, так как не создает лишних копий.", "Разницы нет, компилятор сам выбирает оптимальный способ в зависимости от контекста."], 0],
    ["Что такое 'висячий' указатель (dangling pointer)?", ["Указатель, который продолжает указывать на область памяти после того, как она была освобождена. Обращение по такому указателю ведет к неопределенному поведению.", "Указатель, которому присвоено значение `nullptr`.", "Указатель, который не был инициализирован и содержит 'мусорный' адрес.", "Указатель на другой указатель."], 0],
    ["Что такое Scrum?", ["Это фреймворк для управления Agile-разработкой, использующий итерации (спринты), в течение которых команда разрабатывает инкремент продукта.", "Это линейная, последовательная модель разработки, где каждая фаза завершается до начала следующей.", "Это методология, основанная на визуализации рабочего процесса и ограничении незавершенной работы (WIP).", "Это набор инженерных практик, таких как парное программирование и разработка через тестирование (TDD)."], 0],
    ["Назовите ключевые роли в Scrum.", ["Product Owner (владелец продукта), Scrum Master (Скрам-мастер), Development Team (команда разработки).", "Менеджер проекта, архитектор, тестировщик, разработчик.", "Заказчик, аналитик, тимлид, программист.", "Руководитель проекта, бизнес-аналитик, QA-инженер."], 0],
    ["Что такое виртуальный деструктор?", ["Деструктор, объявленный с ключевым словом `virtual`. Он необходим в базовом классе, если объекты производных классов будут удаляться через указатель на базовый класс, чтобы гарантировать вызов правильного деструктора.", "Деструктор, который нельзя вызывать напрямую, он вызывается только виртуальной машиной.", "Это деструктор, который может принимать аргументы, в отличие от обычного.", "Такого понятия в С++ не существует."], 0],
    ["Объясните ключевое слово `volatile` в C.", ["Указывает компилятору, что значение переменной может быть изменено извне (например, аппаратно или другим потоком), и поэтому оптимизации, связанные с кэшированием этой переменной, должны быть отключены.", "Делает переменную неизменяемой после инициализации.", "Указывает, что переменная будет храниться в регистре процессора для более быстрого доступа.", "Определяет глобальную переменную, видимую во всех файлах проекта."], 0],
    ["В чем основное преимущество Agile-методологий?", ["Высокая гибкость и способность быстро адаптироваться к изменяющимся требованиям заказчика.", "Строгое планирование и предсказуемость сроков и бюджета.", "Минимальное количество документации, что ускоряет разработку.", "Отсутствие необходимости в тестировании на ранних этапах."], 0],
    ["Что такое 'технический долг'?", ["Это метафора, описывающая накопленные в коде или архитектуре проблемы, вызванные выбором 'легких' или быстрых решений вместо более правильных, но требующих больше времени. Этот 'долг' со временем затрудняет дальнейшую разработку и требует 'возврата' в виде рефакторинга.", "Это стоимость лицензий на используемое программное обеспечение.", "Это задолженность компании перед разработчиками по заработной плате.", "Это время, которое команда тратит на исправление багов вместо разработки новых функций."], 0],
    ["Каково назначение `static` для члена класса в C++?", ["Делает член класса общим для всех экземпляров этого класса. Статический член существует в единственном экземпляре, независимо от количества созданных объектов.", "Делает член класса неизменяемым.", "Делает член класса доступным только внутри файла, где он объявлен.", "Указывает, что член будет инициализирован только один раз при первом обращении."], 0],
    ["Что такое Kanban?", ["Это методология, ориентированная на визуализацию рабочего процесса (Kanban-доска), ограничение незавершенной работы (WIP) и управление потоком задач.", "Это итеративная методология с фиксированными по времени спринтами.", "Это модель, где тестирование является центральной частью каждой фазы разработки.", "Это набор правил для написания чистого и поддерживаемого кода."], 0],
    ["Что делает `const` в конце объявления метода класса?", ["`void myMethod() const;` объявляет константный метод. Такой метод не может изменять состояние объекта (его нестатические члены данных).", "Указывает, что метод возвращает константное значение.", "Указывает, что метод является устаревшим и не рекомендуется к использованию.", "Это синтаксическая ошибка, `const` не может стоять в этом месте."], 0],
    ["Что такое перегрузка операторов в C++?", ["Это возможность задать пользовательское поведение для стандартных операторов (например, +, -, ==) применительно к объектам классов.", "Это создание нескольких функций с одним и тем же именем, но разными наборами параметров.", "Это переопределение оператора в дочернем классе.", "Это использование операторов для работы с указателями."], 0],
    ["Что такое рефакторинг?", ["Процесс улучшения внутренней структуры существующего кода без изменения его внешнего поведения. Цель — сделать код более чистым, понятным и простым в поддержке.", "Процесс написания кода с нуля для замены старой системы.", "Процесс добавления новой функциональности в существующую систему.", "Процесс исправления ошибок (багов) в коде."], 0],
    ["Чем `calloc` отличается от `malloc`?", ["`calloc` выделяет память и инициализирует ее нулями, в то время как `malloc` просто выделяет память, оставляя ее содержимое неопределенным. Также `calloc` принимает два аргумента: количество элементов и их размер.", "`malloc` быстрее, чем `calloc`, так как не тратит время на обнуление памяти.", "`calloc` предназначен для выделения памяти под массивы, а `malloc` — под одиночные переменные.", "Различий в функциональности нет, `calloc` - это просто более старая версия `malloc`."], 0],
    ["Что такое 'принцип единственной ответственности' (SRP)?", ["Принцип, согласно которому каждый класс или модуль должен иметь одну, и только одну, причину для изменения. Это означает, что он должен быть ответственен только за одну часть функциональности системы.", "Принцип, который гласит, что программные сущности должны быть открыты для расширения, но закрыты для модификации.", "Принцип, требующий, чтобы объекты в программе можно было заменять их подтипами без изменения правильности выполнения программы.", "Принцип, который советует разделять 'толстые' интерфейсы на более мелкие и специфические."], 0],

    ["Какая основная задача Scrum Master?", ["Устранение препятствий, мешающих команде разработки, и обеспечение соблюдения принципов и практик Scrum. Он выступает в роли коуча и фасилитатора.", "Определение приоритетов задач в бэклоге продукта.", "Написание кода и участие в разработке наравне с командой.", "Прямое управление командой разработки и распределение задач."], 0],

const questionTextEl = document.getElementById('question-text');
const answersContainerEl = document.getElementById('answers-container');
const feedbackEl = document.getElementById('feedback');
const nextButton = document.getElementById('next-button');

let currentQuestionIndex = 0;
let score = 0;
let correctAnswerText = '';

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function showQuestion() {
  feedbackEl.innerHTML = '';
  nextButton.disabled = true;
  
  if (currentQuestionIndex >= questions.length) {
      const percentage = (score / questions.length) * 100;
      let message = '';
      if (percentage >= 95) {
          message = 'Отлично!';
      } else if (percentage >= 75) {
          message = 'Хорошо!';
      } else if (percentage >= 50) {
          message = 'Сомнительно, но окей.';
      } else if (percentage >= 25) {
          message = 'Пиздец, бро.';
      } else {
          message = 'Тебе пизда :)';
      }

      questionTextEl.textContent = 'Тест завершен!';
      answersContainerEl.innerHTML = '';
      feedbackEl.innerHTML = `Вы набрали ${score} из ${questions.length} (${percentage.toFixed(0)}%). ${message}`;
      nextButton.textContent = 'Начать заново';
      nextButton.disabled = false;
      nextButton.onclick = () => location.reload();
      return;
  }

  const questionData = questions[currentQuestionIndex];
  const question = questionData[0];
  const allAnswers = questionData[1];
  const correctAnswIndex = questionData[2]
  correctAnswerText = allAnswers[correctAnswIndex];

  // Get all incorrect answers
  const incorrectAnswers = allAnswers.filter((_, index) => index !== correctAnswIndex);
  
  // Shuffle incorrect answers and pick two
  shuffleArray(incorrectAnswers);
  const selectedIncorrectAnswers = incorrectAnswers.slice(0, 2);

  // Create the final list of answers for the user and shuffle it
  const answersToShow = [correctAnswerText, ...selectedIncorrectAnswers];
  shuffleArray(answersToShow);


  questionTextEl.textContent = `${currentQuestionIndex + 1}. ${question}`;
  answersContainerEl.innerHTML = '';

  answersToShow.forEach(answer => {
    const button = document.createElement('button');
    button.textContent = answer;
    button.classList.add('answer-btn');
    button.onclick = () => selectAnswer(button, answer);
    answersContainerEl.appendChild(button);
  });
}

function selectAnswer(selectedButton, selectedAnswer) {
  const isCorrect = selectedAnswer === correctAnswerText;

  Array.from(answersContainerEl.children).forEach(button => {
    button.disabled = true;
    if (button.textContent === correctAnswerText) {
      button.classList.add('correct');
      if (button.textContent === selectedButton.textContent) {
          if (!selectedButton.classList.contains('wrong')) {
             score++;
          }
      }
    } else if (button === selectedButton) {
      button.classList.add('wrong');
    }
  });

  if (isCorrect) {
    feedbackEl.textContent = 'Правильно!';
    feedbackEl.className = 'correct-text';
  } else {
    feedbackEl.textContent = 'Неправильно!';
    feedbackEl.className = 'wrong-text';
  }

  nextButton.disabled = false;
}

nextButton.addEventListener('click', () => {
    currentQuestionIndex++;
    showQuestion();
});

// Initial load
shuffleArray(questions);
showQuestion();
</script>
